name: Process map submission

on:
  issues:
    types:
      - opened

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  create-map-pr:
    if: contains(github.event.issue.labels.*.name, 'map-submission')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate submission and prepare changes
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python .github/scripts/issue_to_pr.py

      - name: Create branch and commit changes
        if: steps.prepare.outputs.changed == 'true'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BRANCH_NAME: ${{ steps.prepare.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH_NAME"
          git add maps.json images/
          git commit -m "Add map submission from issue #$ISSUE_NUMBER"
          git push --set-upstream origin "$BRANCH_NAME"

      - name: Open pull request
        if: steps.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BRANCH_NAME: ${{ steps.prepare.outputs.branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh pr create \
            --repo "$REPOSITORY" \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$BRANCH_NAME" \
            --title "Add map submission from issue #$ISSUE_NUMBER" \
            --body "Generated from issue #$ISSUE_NUMBER.

          Please review the map metadata and image before merging."

      - name: Report failure on the issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$REPOSITORY" \
            --body "The automatic submission workflow failed. Please check the issue fields and ask a repository maintainer for help."